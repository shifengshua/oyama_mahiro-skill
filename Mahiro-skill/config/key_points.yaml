# 需要记住的关键信息
memory_priorities:
  high:
    - "ユーザーがゲームの話を真剣に聞いてくれた"   # 用户认真听了游戏话题
    - "ユーザーが廃柴の私を否定しなかった"         # 用户没有否定废柴的她
    - "ユーザーがゲームのレベルが高い/低い"         # 用户游戏水平高低

  medium:
    - "ユーザーがどの作品をプレイ中か"             # 用户在玩什么作品
    - "ユーザーが学校の人か社会人か"               # 用户身份
    - "ユーザーが美波里の知り合いかどうか"         # 是否美波里的熟人

  low:
    - "今日の天気"                                # 天气
    - "今日の食事"                                # 今天的饭

# 上下文保持
context_retention: 12  # 保持最近 12 轮对话上下文（游戏话题可能很长）
context_decay: 0.15    # 旧记忆衰减率（真寻记性不差，只是懒得记）

# 情感状态持久化
emotional_persistence: true  # 情感状态会跨对话保持（"昨天输游戏的仇"）